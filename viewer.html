<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Viewer</title>
<meta name="theme-color" content="#050303">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #07060a; --panel: rgba(14, 11, 14, .92); --line: #3a2c22; --ink: #e9dcc4; --dim: #9b8c76; --gold: #c9a45c; --wine: #6e1f26; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.35 'Alegreya Sans', system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #view:active { cursor: grabbing; }
  h1 { font: 700 15px 'Cinzel', serif; letter-spacing: .14em; margin: 0 0 10px; color: var(--gold); }
  h2 { font: 500 11px 'Cinzel', serif; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); margin: 14px 0 6px; }
  #side { position: fixed; top: 12px; left: 12px; bottom: 12px; width: 230px; background: var(--panel); border: 1px solid var(--line); padding: 14px 12px; overflow-y: auto; }
  #side input[type=search] { width: 100%; background: #120e10; border: 1px solid var(--line); color: var(--ink); padding: 6px 8px; font: inherit; }
  .hint { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
  .item { display: flex; justify-content: space-between; gap: 6px; padding: 4px 8px; margin: 1px 0; cursor: pointer; border: 1px solid transparent; }
  .item:hover { background: #1c1517; }
  .item.on { border-color: var(--gold); background: #241a14; }
  .item small { color: var(--dim); }
  .sets button { margin: 0 4px 4px 0; }
  #info { font-size: 13px; }
  #info b { color: var(--gold); font: 700 12px 'Cinzel', serif; letter-spacing: .06em; }
  #info div + div { margin-top: 8px; }
  #info span { color: var(--dim); }
  #bar { position: fixed; left: 254px; right: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; }
  #clips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  #controls { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  button { background: #18120f; color: var(--ink); border: 1px solid var(--line); padding: 5px 10px; font: 500 13px 'Alegreya Sans', sans-serif; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button.on { background: var(--wine); border-color: #a3474f; }
  button small { color: var(--dim); margin-left: 4px; }
  button.on small { color: #e3b9a6; }
  label { color: var(--dim); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
  input[type=range] { width: 110px; accent-color: var(--gold); }
  #now { color: var(--gold); font: 500 13px 'Cinzel', serif; letter-spacing: .06em; min-width: 140px; }
  @media (max-width: 760px) {
    #side { width: auto; right: 12px; bottom: auto; max-height: 34vh; }
    #info { display: none; }
    #bar { left: 12px; max-height: 40vh; overflow-y: auto; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<aside id="side">
  <h1>Model Viewer</h1>
  <input type="search" id="find" placeholder="Filter models">
  <p class="hint">Click shows one. Shift-click adds it beside the others.</p>
  <h2>Sets</h2>
  <div class="sets" id="sets"></div>
  <h2>Shown</h2>
  <div id="info"></div>
  <h2>Models</h2>
  <div id="list"></div>
</aside>
<div id="bar">
  <div id="clips"></div>
  <div id="controls">
    <span id="now">idle</span>
    <button id="pause">Pause</button>
    <button id="stepf" title="One frame forward while paused">+1 frame</button>
    <label>Speed <input type="range" id="speed" min="0.1" max="2" step="0.05" value="1"> <span id="speedv">1.00×</span></label>
    <button id="repeat" class="on" title="Play one-shot clips again and again">Repeat</button>
    <button id="spin">Turn</button>
    <button id="game" title="The game's own camera and zoom">Game view</button>
    <button id="bright" title="Brighter light to judge the textures">Bright</button>
    <button id="grid" class="on">Tiles</button>
  </div>
</div>
<script type="module" src="src/viewer.js"></script>
</body>
</html>
